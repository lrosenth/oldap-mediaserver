# Deployment target
media_domain: media.oldap.org
oldap_api_url: https://api.oldap.org

# Component image tags are supplied explicitly by the repository-root Makefile,
# which derives them from imageserver/VERSION and mediaserver/VERSION.
caddy_image_tag: 2.8

# Runtime behavior
app_env: Prod
import_callback_reconcile_seconds: 60
ingest_part_max_age_seconds: 86400
ingest_worker_id: media-ingest-1
ingest_worker_poll_seconds: 10
ingest_worker_heartbeat_seconds: 60
ingest_worker_lease_seconds: 300
# Start the single-concurrency ZIP validation worker with every normal deploy.
# Set false only as an explicit operational maintenance/incident switch.
zip_import_worker_enabled: true
export_worker_id: media-export-1
export_worker_poll_seconds: 10
export_worker_heartbeat_seconds: 60
export_worker_lease_seconds: 300
# Start only after the purpose-specific production secrets have been provisioned.
zip_export_worker_enabled: false
# The frozen 20% filesystem reserve always applies. Set this byte count only
# when operations require a larger absolute reserve.
storage_absolute_reserve_bytes: 0
force_pull: false
rollback: false

# Host filesystem layout
media_root: /data/media
media_ingest_root: /data/oldap-ingest
media_import_records_root: /data/oldap-import-records
media_export_root: /data/oldap-exports
media_storage_mountpoint: /data
deploy_root: /opt/oldap-mediaserver
compose_dir: "{{ deploy_root }}/compose"
caddy_data_dir: "{{ deploy_root }}/caddy-data"
caddy_config_dir: "{{ deploy_root }}/caddy-config"

# Flask / OLDAP integration. Secrets are supplied through an ignored vars file
# or Ansible Vault and are deliberately absent from tracked group vars.
oldap_jwt_issuer: https://oldap.org
oldap_jwt_audience: oldap-api
oldap_import_service_subject: media.oldap.org
oldap_export_service_subject: media.oldap.org
oldap_unknown_userid: unknown
oldap_unknown_password: ""
cors_origins: "https://app.oldap.org,https://fasnacht.oldap.org,https://fasnacht.digital"

# ACME contact address used by the production Caddy instance.
caddy_acme_email: lukas.rosenthaler@unibas.ch

# Optional firewall management via UFW
manage_ufw: false

# Docker apt repo architecture
# amd64 for x86_64 VMs; change if needed.
docker_apt_arch: amd64

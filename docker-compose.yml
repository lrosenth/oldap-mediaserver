services:
  # Flask upload + auth resolver (your app.py)
  mediaserver:
    image: lrosenth/oldap-mediahelper:${OLDAP_MEDIAHELPER_TAG:-latest}
    container_name: oldap-mediahelper
    env_file:
      - ./mediaserver.env
      - ./mediahelper-access.env
    environment:
      - IIIF_BASE_URL=${IIIF_BASE_URL:-http://localhost:8088/iiif/3/}
      - MEDIA_BASE_URL=${MEDIA_BASE_URL:-http://localhost:8088/}
      - APP_ENV=${APP_ENV:-Dev}
      - OLDAP_IMPORT_CALLBACK_RECONCILE_SECONDS=${OLDAP_IMPORT_CALLBACK_RECONCILE_SECONDS:-60}
      - OLDAP_INGEST_PART_MAX_AGE_SECONDS=${OLDAP_INGEST_PART_MAX_AGE_SECONDS:-86400}
      - OLDAP_STORAGE_ABSOLUTE_RESERVE_BYTES=${OLDAP_STORAGE_ABSOLUTE_RESERVE_BYTES:-0}
      - OLDAP_MOBILE_UPLOAD_ROOT=/data/mobile-uploads
      - OLDAP_MOBILE_MAX_ORIGINAL_BYTES=${OLDAP_MOBILE_MAX_ORIGINAL_BYTES:-104857600}
      - OLDAP_MOBILE_CHUNK_BYTES=${OLDAP_MOBILE_CHUNK_BYTES:-4194304}
      - OLDAP_MOBILE_INACTIVITY_SECONDS=${OLDAP_MOBILE_INACTIVITY_SECONDS:-604800}
      - OLDAP_MOBILE_LEASE_SECONDS=${OLDAP_MOBILE_LEASE_SECONDS:-300}
      - OLDAP_MOBILE_MAX_ACTIVE_PER_USER=${OLDAP_MOBILE_MAX_ACTIVE_PER_USER:-20}
      - OLDAP_MOBILE_MAX_ACTIVE_PER_STAGING_AREA=${OLDAP_MOBILE_MAX_ACTIVE_PER_STAGING_AREA:-100}
      - OLDAP_MOBILE_MAX_RESERVED_BYTES_PER_USER=${OLDAP_MOBILE_MAX_RESERVED_BYTES_PER_USER:-2147483648}
      - OLDAP_MOBILE_MAX_RESERVED_BYTES_PER_STAGING_AREA=${OLDAP_MOBILE_MAX_RESERVED_BYTES_PER_STAGING_AREA:-21474836480}
      - OLDAP_MOBILE_MAX_PROCESSING_JOBS=${OLDAP_MOBILE_MAX_PROCESSING_JOBS:-2}

    volumes:
      - ${MEDIA_DATA_HOST:-./data}:/data/images
      - ${MEDIA_INGEST_HOST:-./ingest}:/data/ingest
      - ${MEDIA_IMPORT_RECORDS_HOST:-./import-records}:/data/import-records:ro
      - ${MEDIA_EXPORT_HOST:-./exports}:/data/exports:ro
      - ${MEDIA_MOBILE_UPLOAD_HOST:-./mobile-uploads}:/data/mobile-uploads
    expose:
      - "8000"
    # Needed on Linux so host.docker.internal works
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    command:
      ["gunicorn",
       "-b", "0.0.0.0:8000",
       "--workers", "${GUNICORN_WORKERS:-1}",
       "--worker-class", "gthread",
       "--threads", "${GUNICORN_THREADS:-4}",
       "--timeout", "${GUNICORN_TIMEOUT:-900}",
       "--graceful-timeout", "${GUNICORN_GRACEFUL_TIMEOUT:-60}",
       "--keep-alive", "${GUNICORN_KEEPALIVE:-5}",
       "--access-logfile", "-",
       "--error-logfile", "-",
       "--log-level", "${GUNICORN_LOG_LEVEL:-info}",
       "app:app"]

  # Additive mobile commit/recovery worker; start only through its explicit profile.
  mobile-media-worker:
    profiles: ["mobile-media"]
    image: lrosenth/oldap-mediahelper:${OLDAP_MEDIAHELPER_TAG:-latest}
    container_name: oldap-mobile-media-worker
    environment:
      OLDAP_API_URL: ${OLDAP_API_URL:-http://host.docker.internal:8000}
      OLDAP_JWT_ISSUER: ${OLDAP_JWT_ISSUER:-https://oldap.org}
      OLDAP_MOBILE_MEDIA_SERVICE_JWT_SECRET: ${OLDAP_MOBILE_MEDIA_SERVICE_JWT_SECRET:-}
      OLDAP_MOBILE_UPLOAD_ROOT: /data/mobile-uploads
      UPLOADER_IMGDIR: /data/images
      OLDAP_STORAGE_ABSOLUTE_RESERVE_BYTES: ${OLDAP_STORAGE_ABSOLUTE_RESERVE_BYTES:-0}
      OLDAP_MOBILE_MAX_ORIGINAL_BYTES: ${OLDAP_MOBILE_MAX_ORIGINAL_BYTES:-104857600}
      OLDAP_MOBILE_CHUNK_BYTES: ${OLDAP_MOBILE_CHUNK_BYTES:-4194304}
      OLDAP_MOBILE_INACTIVITY_SECONDS: ${OLDAP_MOBILE_INACTIVITY_SECONDS:-604800}
      OLDAP_MOBILE_LEASE_SECONDS: ${OLDAP_MOBILE_LEASE_SECONDS:-300}
      OLDAP_MOBILE_MAX_ACTIVE_PER_USER: ${OLDAP_MOBILE_MAX_ACTIVE_PER_USER:-20}
      OLDAP_MOBILE_MAX_ACTIVE_PER_STAGING_AREA: ${OLDAP_MOBILE_MAX_ACTIVE_PER_STAGING_AREA:-100}
      OLDAP_MOBILE_MAX_RESERVED_BYTES_PER_USER: ${OLDAP_MOBILE_MAX_RESERVED_BYTES_PER_USER:-2147483648}
      OLDAP_MOBILE_MAX_RESERVED_BYTES_PER_STAGING_AREA: ${OLDAP_MOBILE_MAX_RESERVED_BYTES_PER_STAGING_AREA:-21474836480}
      OLDAP_MOBILE_MAX_PROCESSING_JOBS: ${OLDAP_MOBILE_MAX_PROCESSING_JOBS:-2}
    volumes:
      - ${MEDIA_DATA_HOST:-./data}:/data/images
      - ${MEDIA_MOBILE_UPLOAD_HOST:-./mobile-uploads}:/data/mobile-uploads
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
    cpus: 4.0
    mem_limit: 6g
    memswap_limit: 6g
    pids_limit: 128
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    command: ["python", "-m", "mobile_upload_worker"]

  # Explicit operator opt-in until the ZIP-import pilot gate is approved.
  ingest-worker:
    profiles: ["zip-import-validation"]
    image: lrosenth/oldap-mediahelper:${OLDAP_MEDIAHELPER_TAG:-latest}
    container_name: oldap-ingest-worker
    environment:
      OLDAP_API_URL: ${OLDAP_API_URL:-http://host.docker.internal:8000}
      OLDAP_JWT_ISSUER: ${OLDAP_JWT_ISSUER:-https://oldap.org}
      OLDAP_IMPORT_SERVICE_JWT_SECRET: ${OLDAP_IMPORT_SERVICE_JWT_SECRET:-}
      OLDAP_IMPORT_SERVICE_SUBJECT: ${OLDAP_IMPORT_SERVICE_SUBJECT:-media.oldap.org}
      OLDAP_INGEST_WORKER_ID: ${OLDAP_INGEST_WORKER_ID:-media-ingest-1}
      OLDAP_INGEST_ROOT: /data/ingest
      OLDAP_IMPORT_RECORDS_ROOT: /data/import-records
      UPLOADER_IMGDIR: /data/images
      OLDAP_STORAGE_ABSOLUTE_RESERVE_BYTES: ${OLDAP_STORAGE_ABSOLUTE_RESERVE_BYTES:-0}
    volumes:
      - ${MEDIA_INGEST_HOST:-./ingest}:/data/ingest
      - ${MEDIA_IMPORT_RECORDS_HOST:-./import-records}:/data/import-records
      - ${MEDIA_DATA_HOST:-./data}:/data/images
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - KILL
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
    cpus: 4.0
    mem_limit: 6g
    memswap_limit: 6g
    pids_limit: 128
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    command: ["python", "-m", "ingest_worker"]

  # Project-neutral, single-concurrency ZIP export builder.
  export-worker:
    profiles: ["zip-export-worker"]
    image: lrosenth/oldap-mediahelper:${OLDAP_MEDIAHELPER_TAG:-latest}
    container_name: oldap-export-worker
    environment:
      OLDAP_API_URL: ${OLDAP_API_URL:-http://host.docker.internal:8000}
      OLDAP_JWT_ISSUER: ${OLDAP_JWT_ISSUER:-https://oldap.org}
      OLDAP_EXPORT_SERVICE_JWT_SECRET: ${OLDAP_EXPORT_SERVICE_JWT_SECRET:-}
      OLDAP_EXPORT_SERVICE_SUBJECT: ${OLDAP_EXPORT_SERVICE_SUBJECT:-media.oldap.org}
      OLDAP_EXPORT_WORKER_ID: ${OLDAP_EXPORT_WORKER_ID:-media-export-1}
      OLDAP_EXPORT_POLL_SECONDS: ${OLDAP_EXPORT_POLL_SECONDS:-10}
      OLDAP_EXPORT_HEARTBEAT_SECONDS: ${OLDAP_EXPORT_HEARTBEAT_SECONDS:-60}
      OLDAP_EXPORT_LEASE_SECONDS: ${OLDAP_EXPORT_LEASE_SECONDS:-300}
      OLDAP_EXPORT_ROOT: /data/exports
      MEDIA_DATA: /data/images
      OLDAP_STORAGE_ABSOLUTE_RESERVE_BYTES: ${OLDAP_STORAGE_ABSOLUTE_RESERVE_BYTES:-0}
    volumes:
      - ${MEDIA_DATA_HOST:-./data}:/data/images:ro
      - ${MEDIA_EXPORT_HOST:-./exports}:/data/exports
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cpus: 2.0
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 64
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    command: ["python", "-m", "export_worker"]

  # SIPI-2 uses the existing OLDAP policy adapter; Caddy preserves /iiif/3.
  imageserver:
    image: ${SIPI_IMAGE:-lrosenth/sipi-2:0.1.0}
    container_name: oldap-imageserver
    entrypoint: ["/bin/sh", "/opt/sipi/examples/oldap/docker-entrypoint.sh"]
    env_file:
      - ./mediaserver.env
    environment:
      SIPI_LISTEN_ADDRESS: "0.0.0.0"
      SIPI_PORT: "8182"
      SIPI_IIIF_ROOT: /data/images
      SIPI_PREFLIGHT_SCRIPT: ${SIPI_PREFLIGHT_SCRIPT:-/opt/sipi/examples/oldap/preflight.lua}
      SIPI_PUBLIC_BASE_URL: ${SIPI_PUBLIC_ORIGIN:-http://localhost:8088}
      SIPI_CACHE_DIR: /var/cache/sipi
      SIPI_CACHE_MAX_BYTES: ${SIPI_CACHE_MAX_BYTES:-1073741824}
      SIPI_IIIF_WORKERS: ${SIPI_IIIF_WORKERS:-4}
      SIPI_SIZE_UPSCALING: ${SIPI_SIZE_UPSCALING:-true}
      SIPI_JPEG_QUALITY: ${SIPI_JPEG_QUALITY:-90}
      SIPI_JPEG_SAMPLING: ${SIPI_JPEG_SAMPLING:-4:4:4}
      SIPI_CORS_ORIGINS: ${SIPI_CORS_ORIGINS:-*}
      SIPI_CORS_CREDENTIALS: ${SIPI_CORS_CREDENTIALS:-false}
      OLDAP_SIPI_ANONYMOUS: ${OLDAP_SIPI_ANONYMOUS:-true}
      SIPI_PREFLIGHT_CONFIG_ANONYMOUS_PERMISSION_TTL: ${SIPI_ANONYMOUS_PERMISSION_TTL:-600}
    volumes:
      - ${MEDIA_DATA_HOST:-./data}:/data/images:ro
      - sipi_cache:/var/cache/sipi
    working_dir: /tmp
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: ${SIPI_MEMORY_LIMIT:-2g}
    expose:
      - "8182"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # Caddy reverse proxy + static bitstream serving
  caddy:
    image: caddy:2.8
    container_name: oldap-media-caddy
    ports:
      - "${CADDY_PORT:-8088}:8088"    # local dev entrypoint (http://localhost:8088)
      # - "8443:443"     # optional local TLS testing
      # On the VM you will usually map 80:80 and 443:443 instead
    environment:
      CADDY_MODE: ${CADDY_MODE:-dev}
      CADDY_PORT: ${CADDY_PORT:-8088}
      # For dev set SITE_ADDRESS=http://localhost to disable auto-https redirects.
      # For prod set SITE_ADDRESS=media.oldap.org to enable HTTPS.
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${MEDIA_DATA_HOST:-./data}:/data/images:ro
      - ${MEDIA_EXPORT_HOST:-./exports}:/data/exports:ro
      - ${CADDY_DATA:-./caddy-data}:/data
      - ${CADDY_CONF:-./caddy-conf}:/config
    depends_on:
      - mediaserver
      - imageserver
    restart: unless-stopped

# Separate from originals and from the legacy Cantaloupe cache; survives restarts.
volumes:
  sipi_cache:
